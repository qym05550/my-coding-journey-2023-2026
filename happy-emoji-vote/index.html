<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Have you smiled today?</title>
  <link rel="stylesheet" href="style.css" />

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
</head>
<body>
  <main class="container">
    <h1 class="title">
      <span class="en">Have you smiled today?</span>
      <span class="ar" lang="ar" dir="rtl">هل ابتسمت اليوم ؟</span>
    </h1>

    <div class="buttons" role="group" aria-label="Mood question">
      <button id="btn-no" class="emoji-btn neutral" type="button" aria-label="Not happy">
        <span class="emoji" aria-hidden="true">😐</span>
        <span class="label" aria-hidden="true">No · لا</span>
      </button>
      <button id="btn-yes" class="emoji-btn happy" type="button" aria-label="Happy">
        <span class="emoji" aria-hidden="true">🤩</span>
        <span class="label" aria-hidden="true">Yes · نعم</span>
      </button>
    </div>

    <div class="stats" aria-live="polite">
      <div class="stat happy"><span class="emoji" aria-hidden="true">🤩</span><span class="stat-label">Happy</span><span id="count-happy" class="count">0</span></div>
      <div class="stat neutral"><span class="emoji" aria-hidden="true">😐</span><span class="stat-label">Not</span><span id="count-sad" class="count">0</span></div>
      <div class="today">Today</div>
    </div>

  </main>

<footer class="site-footer" role="contentinfo" style="display: flex; justify-content: space-between; align-items: center;">
  <p style="margin: 0;">Made by <span aria-hidden="true"> Hadeel ✨</span> Have a lovely day!</p>
</footer>

  <script src="script.js"></script>
</body>
</html>
