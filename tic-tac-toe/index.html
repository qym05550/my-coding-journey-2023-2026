<!-- Tic Tac Toe Game in HTML, CSS, and JavaScript -->

<!DOCTYPE html>
<html>

<head>
    <title>Tic Tac Toe</title>
    <style>
        /* Add some basic styling to make the game look nicer */
        
        body {
            text-align: center;
        }
        
        #game-options {
            margin-bottom: 20px;
        }
        
        #game-options button {
            margin: 10px;
        }
        
        table {
            margin: 0 auto;
            border-collapse: collapse;
        }
        
        td {
            width: 50px;
            height: 50px;
            border: 1px solid black;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <h1>Tic Tac Toe</h1>
    <div id="game-options">
        <button onclick="playWithFriend()">Play with a Friend</button>
        <button onclick="playWithComputer()">Play with the Computer</button>
    </div>

    <div id="computer-level" style="display: none;">
        <p>Choose a difficulty level:</p>
        <button onclick="setDifficulty('easy')">Easy</button>
        <button onclick="setDifficulty('medium')">Medium</button>
        <button onclick="setDifficulty('hard')">Hard</button>
    </div>

    <table id="game-board" style="display: none;">
        <tr>
            <td id="cell-0" onclick="makeMove(this)"></td>
            <td id="cell-1" onclick="makeMove(this)"></td>
            <td id="cell-2" onclick="makeMove(this)"></td>
        </tr>
        <tr>
            <td id="cell-3" onclick="makeMove(this)"></td>
            <td id="cell-4" onclick="makeMove(this)"></td>
            <td id="cell-5" onclick="makeMove(this)"></td>
        </tr>
        <tr>
            <td id="cell-6" onclick="makeMove(this)"></td>
            <td id="cell-7" onclick="makeMove(this)"></td>
            <td id="cell-8" onclick="makeMove(this)"></td>
        </tr>
    </table>

    <p id="game-status"></p>
