<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELTED | روابطنا</title>
<meta name="description" content="MELTED - تواصلي معنا من هنا.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&family=Yesteryear&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F3EAD8;
    --tan: #E4D3B5;
    --tan-deep: #D3BC93;
    --choco: #3B2417;
    --choco-soft: #5C3A21;
    --caramel: #B9793B;
    --paper: #FBF6EC;
    --shadow: rgba(59, 36, 23, 0.18);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background: radial-gradient(circle at 50% 0%, var(--tan) 0%, var(--cream) 55%, var(--cream) 100%);
    color: var(--choco);
    font-family: 'Tajawal', sans-serif;
    display:flex;
    justify-content:center;
    padding: 56px 18px 40px;
    position: relative;
    overflow-x:hidden;
  }
  a{ color:inherit; text-decoration:none; }
  :focus-visible{ outline: 3px solid var(--caramel); outline-offset: 3px; border-radius: 10px; }

  .script{ font-family:'Yesteryear', cursive; direction:ltr; display:inline-block; }
  .display{ font-family:'Lalezar','Tajawal',sans-serif; font-weight:400; letter-spacing:.5px; }

  /* decorative drip blobs in background */
  .blob{
    position:absolute;
    border-radius:50%;
    background: var(--tan-deep);
    opacity:.35;
    filter: blur(2px);
  }
  .blob1{ width:220px; height:120px; top:-40px; right:-60px; border-radius: 40% 60% 60% 40% / 50% 50% 50% 50%; }
  .blob2{ width:160px; height:100px; bottom:20px; left:-50px; border-radius: 50% 50% 60% 40% / 40% 60% 40% 60%; opacity:.3;}

  .wrap{
    width:100%;
    max-width: 460px;
    position:relative;
    z-index:1;
  }

  .profile{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom: 34px;
  }
  .avatar{
    width: 132px;
    height: 132px;
    border-radius: 50%;
    overflow:hidden;
    box-shadow: 0 16px 34px var(--shadow), 0 0 0 6px var(--paper), 0 0 0 8px var(--tan-deep);
    margin-bottom: 18px;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

  .brand-name{
    font-size: 2.3rem;
    color: var(--choco);
    margin-bottom: 4px;
  }
  .brand-tag{
    font-size: 1.35rem;
    color: var(--caramel);
    margin-bottom: 6px;
  }
  .brand-sub{
    font-size: 0.95rem;
    color: var(--choco-soft);
    font-weight: 500;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap: 16px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--paper);
    border: 1.5px solid var(--tan-deep);
    padding: 16px 20px;
    border-radius: 18px;
    font-weight:700;
    font-size: 1.05rem;
    color: var(--choco);
    box-shadow: 0 8px 20px var(--shadow);
    overflow:hidden;
    isolation:isolate;
    transition: transform .2s ease, box-shadow .2s ease, color .2s ease;
    cursor:pointer;
    text-align: right;
    width:100%;
  }
  .link-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 16px 30px var(--shadow);
    color: var(--paper);
  }
  .link-btn::before{
    content:"";
    position:absolute;
    inset: -20% 0 auto 0;
    height: 0%;
    background: var(--choco);
    z-index:-1;
    border-radius: 0 0 60% 60% / 0 0 100% 100%;
    transition: height .45s cubic-bezier(.4,0,.2,1);
  }
  .link-btn:hover::before{ height: 160%; }

  .icon-wrap{
    width: 42px; height:42px;
    border-radius: 50%;
    background: var(--tan);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition: background .2s ease;
  }
  .link-btn:hover .icon-wrap{ background: rgba(251,246,236,0.18); }
  .icon-wrap svg{ width:22px; height:22px; }

  .link-label{ flex:1; }
  .link-label small{
    display:block;
    font-weight:400;
    font-size: 0.78rem;
    opacity:.75;
    margin-top:2px;
  }

  .footer-note{
    text-align:center;
    margin-top: 40px;
    color: var(--choco-soft);
    font-size: 0.85rem;
  }
  .footer-note .script{ font-size: 1.15rem; color: var(--caramel); display:block; margin-bottom:4px; }

  /* Modal for INFO */
  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(59,36,23,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 100;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background: var(--paper);
    border-radius: 24px;
    max-width: 380px;
    width:100%;
    padding: 30px 26px;
    text-align:center;
    box-shadow: 0 30px 60px rgba(0,0,0,.35);
    position:relative;
  }
  .modal-close{
    position:absolute; top:14px; left:14px;
    background: var(--tan);
    border:none;
    width:32px; height:32px;
    border-radius:50%;
    font-size: 1.1rem;
    cursor:pointer;
    color: var(--choco);
  }
  .modal-frame{
    width:100%;
    aspect-ratio: 4/5;
    border: 2px dashed var(--caramel);
    border-radius: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--choco-soft);
    font-size: 0.95rem;
    background: var(--tan);
    margin-bottom: 16px;
    text-align:center;
    padding: 20px;
    line-height:1.8;
  }
  .modal h3{ font-family:'Lalezar'; font-size:1.4rem; margin-bottom:8px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
