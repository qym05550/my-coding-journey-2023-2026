<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Study Lessons
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>

<body class="bg-[#F3F3E0]">
    <header class="bg-[#608BC1] text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">
                Study Board
            </h1>
            <nav>
                <ul class="flex space-x-4">
                    <li>
                        <a class="hover:underline" href="#">
        Home
       </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container mx-auto mt-8">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">
                Lessons
            </h2>
            <div class="flex space-x-2">
                <input class="px-3 py-2 border rounded" id="searchInput" oninput="searchLessons()" placeholder="Search lessons..." type="text" />
                <button class="bg-[#608BC1] text-white px-4 py-2 rounded hover:bg-blue-700" onclick="openAddLessonModal()">
      <i class="fas fa-plus">
      </i>
      Add Lesson
     </button>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="lessonsGrid">
            <div class="bg-white p-4 rounded shadow">
                <img alt="Placeholder image of a lesson thumbnail" class="w-full h-40 object-cover rounded mb-4" height="400" src="https://storage.googleapis.com/a1aa/image/537OuLJ6aUJDNZrILjOafw1mmlWyjHxfZQOsmt3Tx2M4bzvTA.jpg" width="600" />
                <h3 class="text-lg font-bold mb-2">
                    Lesson 1: Introduction to HTML
                </h3>
                <p class="text-gray-700 mb-4">
                    Learn the basics of HTML, the standard markup language for creating web pages.
                </p>
                <div class="flex space-x-2">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
       View Lesson
      </button>
                    <button class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600" onclick="editLesson(this)">
       Edit Lesson
      </button>
                    <button class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700" onclick="removeLesson(this)">
       Remove Lesson
      </button>
                </div>
            </div>
        </div>
    </main>
    <div class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden" id="addLessonModal">
        <div class="bg-white p-4 rounded shadow-lg w-1/3">
            <h2 class="text-xl font-bold mb-4">
                Add New Lesson
            </h2>
            <form id="addLessonForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="lessonTitle">
       Lesson Title
      </label>
                    <input class="w-full px-3 py-2 border rounded" id="lessonTitle" name="lessonTitle" type="text" />
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="lessonDescription">
       Lesson Description
      </label>
                    <textarea class="w-full px-3 py-2 border rounded" id="lessonDescription" name="lessonDescription" rows="4">
      </textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="lessonImage">
       Lesson Image URL
      </label>
                    <input class="w-full px-3 py-2 border rounded" id="lessonImage" name="lessonImage" type="text" />
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="lessonDocument">
       Lesson Document
      </label>
                    <input class="w-full px-3 py-2 border rounded" id="lessonDocument" name="lessonDocument" type="file" />
                </div>
                <div class="flex justify-end">
                    <button class="bg-gray-600 text-white px-4 py-2 rounded mr-2" onclick="closeAddLessonModal()" type="button">
       Back
      </button>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded" type="submit">
       Done
      </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        function openAddLessonModal() {
            document.getElementById('addLessonModal').classList.remove('hidden');
        }

        function closeAddLessonModal() {
            document.getElementById('addLessonModal').classList.add('hidden');
        }

        document.getElementById('addLessonForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const title = document.getElementById('lessonTitle').value;
            const description = document.getElementById('lessonDescription').value;
            const imageUrl = document.getElementById('lessonImage').value;
            const documentFile = document.getElementById('lessonDocument').files[0];

            const lessonContainer = document.createElement('div');
            lessonContainer.classList.add('bg-white', 'p-4', 'rounded', 'shadow');

            const lessonImage = document.createElement('img');
            lessonImage.src = imageUrl;
            lessonImage.alt = `Image for ${title}`;
            lessonImage.classList.add('w-full', 'h-40', 'object-cover', 'rounded', 'mb-4');
            lessonContainer.appendChild(lessonImage);

            const lessonTitle = document.createElement('h3');
            lessonTitle.classList.add('text-lg', 'font-bold', 'mb-2');
            lessonTitle.textContent = title;
            lessonContainer.appendChild(lessonTitle);

            const lessonDescription = document.createElement('p');
            lessonDescription.classList.add('text-gray-700', 'mb-4');
            lessonDescription.textContent = description;
            lessonContainer.appendChild(lessonDescription);

            if (documentFile) {
                const lessonDocument = document.createElement('a');
                lessonDocument.href = URL.createObjectURL(documentFile);
                lessonDocument.textContent = 'View Document';
                lessonDocument.classList.add('text-blue-600', 'hover:underline', 'block', 'mb-4');
                lessonContainer.appendChild(lessonDocument);
            }

            const buttonContainer = document.createElement('div');
            buttonContainer.classList.add('flex', 'space-x-2');

            const viewButton = document.createElement('button');
            viewButton.classList.add('bg-blue-600', 'text-white', 'px-4', 'py-2', 'rounded', 'hover:bg-blue-700');
            viewButton.textContent = 'View Lesson';
            buttonContainer.appendChild(viewButton);

            const editButton = document.createElement('button');
            editButton.classList.add('bg-yellow-500', 'text-white', 'px-4', 'py-2', 'rounded', 'hover:bg-yellow-600');
            editButton.textContent = 'Edit Lesson';
            editButton.setAttribute('onclick', 'editLesson(this)');
            buttonContainer.appendChild(editButton);

            const removeButton = document.createElement('button');
            removeButton.classList.add('bg-red-600', 'text-white', 'px-4', 'py-2', 'rounded', 'hover:bg-red-700');
            removeButton.textContent = 'Remove Lesson';
            removeButton.setAttribute('onclick', 'removeLesson(this)');
            buttonContainer.appendChild(removeButton);

            lessonContainer.appendChild(buttonContainer);

            document.getElementById('lessonsGrid').appendChild(lessonContainer);

            closeAddLessonModal();
        });

        function editLesson(button) {
            const lessonContainer = button.closest('.bg-white');
            const title = lessonContainer.querySelector('h3').textContent;
            const description = lessonContainer.querySelector('p').textContent;
            const imageUrl = lessonContainer.querySelector('img').src;
            const documentUrl = lessonContainer.querySelector('a') ? lessonContainer.querySelector('a').href : '';

            document.getElementById('lessonTitle').value = title;
            document.getElementById('lessonDescription').value = description;
            document.getElementById('lessonImage').value = imageUrl;
            document.getElementById('lessonDocument').value = documentUrl;

            openAddLessonModal();

            lessonContainer.remove();
        }

        function removeLesson(button) {
            const lessonContainer = button.closest('.bg-white');
            lessonContainer.remove();
        }

        function searchLessons() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const lessons = document.querySelectorAll('#lessonsGrid .bg-white');

            lessons.forEach(lesson => {
                const title = lesson.querySelector('h3').textContent.toLowerCase();
                if (title.includes(searchInput)) {
                    lesson.style.display = '';
                } else {
                    lesson.style.display = 'none';
                }
            });
        }
    </script>
</body>

</html>
