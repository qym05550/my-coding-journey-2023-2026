<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        
        .container {
            max-width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        label {
            display: block;
            margin-bottom: 10px;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #218838;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.2em;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Tax Calculator</h2>
        <label for="income">Enter Your Income:</label>
        <input type="number" id="income" placeholder="Enter amount">

        <label for="taxRate">Enter Tax Rate (%):</label>
        <input type="number" id="taxRate" placeholder="Enter tax rate">

        <button onclick="calculateTax()">Calculate Tax</button>

        <div class="result" id="result"></div>
    </div>

    <script>
        function calculateTax() {
            const income = parseFloat(document.getElementById('income').value);
            const taxRate = parseFloat(document.getElementById('taxRate').value) / 100;

            if (isNaN(income) || isNaN(taxRate)) {
                document.getElementById('result').innerHTML = "Please enter valid numbers.";
                return;
            }

            const tax = income * taxRate;
            const netIncome = income - tax;

            document.getElementById('result').innerHTML = `
                <strong>Tax:</strong> $${tax.toFixed(2)}<br>
                <strong>Net Income:</strong> $${netIncome.toFixed(2)}
            `;
        }
    </script>

</body>

</html>
